name: Build and Deploy ZynstormECFPlatform

on:
  push:
    branches:
      - main
      - Staging

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: zynstormecf-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jmtrinidad/zynstormecfplatform
  DOKPLOY_URL: https://deploy.zynstorm.com
  # TODO: reemplazar por los Application ID de Dokploy.
  DOKPLOY_APP_MAIN: REPLACE_ME_MAIN_APPLICATION_ID
  DOKPLOY_APP_STAGING: REPLACE_ME_STAGING_APPLICATION_ID

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker tags
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=$IMAGE_NAME:main,$IMAGE_NAME:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE_NAME:staging,$IMAGE_NAME:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # DEPLOY MAIN
  # ============================================================
  deploy-main:
    name: Deploy MAIN

    if: github.ref == 'refs/heads/main'

    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Deploy MAIN
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |

          if [ -z "$DOKPLOY_API_TOKEN" ]; then
            echo "DOKPLOY_API_TOKEN is not configured"
            exit 1
          fi

          case "$DOKPLOY_APP_MAIN" in REPLACE_ME*) echo "DOKPLOY_APP_MAIN is not configured"; exit 1;; esac

          echo "Deploying ZynstormECFPlatform MAIN"

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "$DOKPLOY_URL/api/application.deploy" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_TOKEN" \
            -d '{
              "applicationId": "${{ env.DOKPLOY_APP_MAIN }}",
              "title": "GitHub Actions - ZynstormECF API MAIN",
              "description": "ZynstormECFPlatform MAIN - Commit ${{ github.sha }}"
            }'


  # ============================================================
  # DEPLOY STAGING
  # ============================================================
  deploy-staging:
    name: Deploy STAGING

    if: github.ref == 'refs/heads/Staging'

    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Deploy STAGING
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |

          if [ -z "$DOKPLOY_API_TOKEN" ]; then
            echo "DOKPLOY_API_TOKEN is not configured"
            exit 1
          fi

          case "$DOKPLOY_APP_STAGING" in REPLACE_ME*) echo "DOKPLOY_APP_STAGING is not configured"; exit 1;; esac

          echo "Deploying ZynstormECFPlatform STAGING"

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "$DOKPLOY_URL/api/application.deploy" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_TOKEN" \
            -d '{
              "applicationId": "${{ env.DOKPLOY_APP_STAGING }}",
              "title": "GitHub Actions - ZynstormECF API STAGING",
              "description": "ZynstormECFPlatform STAGING - Commit ${{ github.sha }}"
            }'

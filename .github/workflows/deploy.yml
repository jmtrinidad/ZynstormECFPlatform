name: Build and Deploy ZynstormECFPlatform

on:
  push:
    branches:
      - main
      - Staging
      # Rama de pruebas: se despliega en su propia aplicación de Dokploy antes de pasar a Staging.
      - feature/emit-idempotente
    # Un push que solo toca documentacion no reconstruye ni redespliega nada.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Docs/**'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: zynstormecf-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jmtrinidad/zynstormecfplatform
  DOKPLOY_URL: https://deploy.zynstorm.com

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------------
      # MAIN
      # --------------------------------------------------------
      - name: Build and push MAIN
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # STAGING
      # --------------------------------------------------------
      - name: Build and push STAGING
        if: github.ref == 'refs/heads/Staging'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # PRUEBAS (feature/emit-idempotente)
      # El tag no puede llevar "/", así que la rama usa el tag fijo "emit-idempotente".
      # --------------------------------------------------------
      - name: Build and push PRUEBAS
        if: github.ref == 'refs/heads/feature/emit-idempotente'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:emit-idempotente
            ${{ env.IMAGE_NAME }}:emit-idempotente-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # DEPLOY MAIN
  # Borrar de la matriz los clientes que no apliquen a este proyecto.
  # ============================================================
  deploy-main:
    name: Deploy MAIN - ${{ matrix.application.name }}

    if: github.ref == 'refs/heads/main'

    needs:
      - build

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false

      matrix:
        application:

          # PRODUCTIONS
          - name: PRODUCTIONS
            id: YOf21sCZLCOu2wo_76Hrv

          # Madame
          # - name: MADAME
          #   id: REPLACE_ME_MADAME_APPLICATION_ID

          # Surtidora Ñoña / SDANIA
          #- name: SDANIA
          # id: REPLACE_ME_SDANIA_APPLICATION_ID

    steps:

      - name: Deploy MAIN ${{ matrix.application.name }}
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |

          if [ -z "$DOKPLOY_API_TOKEN" ]; then
            echo "DOKPLOY_API_TOKEN is not configured"
            exit 1
          fi

          case "${{ matrix.application.id }}" in
            REPLACE_ME*) echo "applicationId de ${{ matrix.application.name }} no configurado"; exit 1 ;;
          esac

          echo "Deploying ${{ matrix.application.name }}"
          echo "Application ID: ${{ matrix.application.id }}"

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "$DOKPLOY_URL/api/application.deploy" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_TOKEN" \
            -d '{
              "applicationId": "${{ matrix.application.id }}",
              "title": "GitHub Actions - ZynstormECF API ${{ matrix.application.name }}",
              "description": "ZynstormECF API MAIN - Commit ${{ github.sha }}"
            }'


  # ============================================================
  # DEPLOY STAGING
  # ============================================================
  deploy-staging:
    name: Deploy STAGING

    if: github.ref == 'refs/heads/Staging'

    needs:
      - build

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:

      - name: Deploy STAGING
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          # TODO: reemplazar por el Application ID de staging en Dokploy.
          STAGING_APPLICATION_ID: dPCOuxeN4uve59aD66tX6
        run: |

          if [ -z "$DOKPLOY_API_TOKEN" ]; then
            echo "DOKPLOY_API_TOKEN is not configured"
            exit 1
          fi

          case "$STAGING_APPLICATION_ID" in
            REPLACE_ME*) echo "STAGING_APPLICATION_ID no configurado"; exit 1 ;;
          esac

          echo "Deploying ZynstormECF API STAGING"

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "$DOKPLOY_URL/api/application.deploy" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_TOKEN" \
            -d '{
              "applicationId": "'"$STAGING_APPLICATION_ID"'",
              "title": "GitHub Actions - ZynstormECF API STAGING",
              "description": "ZynstormECF API STAGING - Commit ${{ github.sha }}"
            }'


  # ============================================================
  # DEPLOY PRUEBAS (feature/emit-idempotente)
  # Usa la MISMA aplicación de Dokploy que Staging (mismo Application ID), con su misma base
  # de datos y su mismo Hangfire. Para probar la rama, en Dokploy se cambia la imagen de esa
  # aplicación a ":emit-idempotente"; para volver a Staging, a ":staging". Mientras apunte a ":emit-idempotente",
  # un push a Staging redespliega pero NO trae la imagen nueva de Staging, y mientras apunte a
  # ":staging", un push a esta rama redespliega pero NO trae la imagen "emit-idempotente".
  # ============================================================
  deploy-pruebas:
    name: Deploy PRUEBAS

    if: github.ref == 'refs/heads/feature/emit-idempotente'

    needs:
      - build

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:

      - name: Deploy PRUEBAS
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          # Es el mismo Application ID que usa deploy-staging.
          PRUEBAS_APPLICATION_ID: dPCOuxeN4uve59aD66tX6
        run: |

          if [ -z "$DOKPLOY_API_TOKEN" ]; then
            echo "DOKPLOY_API_TOKEN is not configured"
            exit 1
          fi

          case "$PRUEBAS_APPLICATION_ID" in
            REPLACE_ME*)
              echo "::warning::PRUEBAS_APPLICATION_ID no está configurado: la imagen 'emit-idempotente' se publicó pero no se redesplegó nada."
              exit 0
              ;;
          esac

          echo "Deploying ZynstormECF API PRUEBAS"

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "$DOKPLOY_URL/api/application.deploy" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_TOKEN" \
            -d '{
              "applicationId": "'"$PRUEBAS_APPLICATION_ID"'",
              "title": "GitHub Actions - ZynstormECF API PRUEBAS",
              "description": "ZynstormECF API PRUEBAS - Commit ${{ github.sha }}"
            }'
